
name: ML API CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # JOB 1: Continuous Integration
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python train.py

      - name: Run pytest
        run: python -m pytest -v

  # JOB 2: Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/snch0718/ml-cicd-project:latest
            ghcr.io/snch0718/ml-cicd-project:${{ github.sha }}

  # JOB 3: Deploy to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer (iss):', payload.iss);
            console.log('OIDC audience (aud):', payload.aud);
            console.log('OIDC subject (sub):', payload.sub);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::195275635591:role/GitHubActions-EC2-Deploy
          aws-region: us-east-1

      - name: Deploy, verify, and rollback if necessary
        env:
          IMAGE: ghcr.io/snch0718/ml-cicd-project:${{ github.sha }}
        run: |
          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -Eeuo pipefail

          IMAGE="__IMAGE__"
          OLD_IMAGE=""
          DEPLOY_STARTED=0

          if docker inspect iris-api >/dev/null 2>&1; then
            OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' iris-api)
            echo "Previous image: $OLD_IMAGE"
          fi

          rollback() {
            EXIT_CODE=$?

            if [ "$EXIT_CODE" -ne 0 ] && [ "$DEPLOY_STARTED" -eq 1 ]; then
              echo "Deployment failed. Rolling back..."

              docker rm -f iris-api || true

              if [ -n "$OLD_IMAGE" ]; then
                docker run -d \
                  --name iris-api \
                  --restart unless-stopped \
                  -p 8000:8000 \
                  "$OLD_IMAGE"

                echo "Rollback completed."
              else
                echo "No previous deployment available to restore."
              fi
            fi
          }

          trap rollback EXIT

          echo "Pulling new image..."
          docker pull "$IMAGE"

          echo "Stopping previous container..."
          docker rm -f iris-api || true
          DEPLOY_STARTED=1

          echo "Starting new container..."
          docker run -d \
            --name iris-api \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"

          echo "Waiting for API health check..."

          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Deployment verified successfully!"
              trap - EXIT
              exit 0
            fi

            echo "Health check attempt $i failed. Retrying..."
            sleep 2
          done

          echo "Health check failed after 30 seconds."
          exit 1
          REMOTE
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//__IMAGE__/$IMAGE}"

          PARAMETERS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0dc0ab3108940e06a \
            --document-name AWS-RunShellScript \
            --comment "Deploy, verify, and rollback ML API" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0dc0ab3108940e06a \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0dc0ab3108940e06a \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0dc0ab3108940e06a \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Deployment monitoring timed out."
          exit 1
